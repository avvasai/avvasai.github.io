<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Page not found | Sai Pranav Avva</title>
  <!-- Root-relative paths: GitHub Pages serves this page at any missing address -->
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" href="/assets/favicon.ico" sizes="any">
  <link rel="icon" href="/assets/favicon-32.png" type="image/png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
</head>
<body>
<header class="masthead">
  <nav class="pill-nav">
    <div class="pill-links">
      <a href="/index.html" class="pill">Home</a>
      <a href="/index.html#projects" class="pill">Projects</a>
      <a href="/index.html#resume" class="pill">Resume</a>
      <a href="/index.html#contact" class="pill">Contact</a>
    </div>
    <div class="pill-right">
      <span class="label">Theme:</span>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark and light theme">
        <span id="themeKnob">Light</span>
      </button>
      <span class="clock" id="clock"></span>
    </div>
  </nav>
</header>

<section class="name-banner not-found">
  <h1 class="giant-name">Page not found</h1>
  <p class="not-found-text">The page you're looking for doesn't exist or has moved. Project pages have moved to new addresses, so the project list is the best place to look.</p>
  <div class="resume-actions not-found-actions">
    <a href="/index.html#projects" class="btn-primary">See all projects</a>
    <a href="/index.html" class="btn-outline">Go to home page</a>
  </div>
</section>

<footer class="footer">
  <span>© <span id="year"></span> Avva Sai Pranav</span>
</footer>

<script>
  const root = document.documentElement;
  const knob = document.getElementById('themeKnob');
  const clockEl = document.getElementById('clock');
  document.getElementById('year').textContent = new Date().getFullYear();

  function applyTheme(theme) {
    root.setAttribute('data-theme', theme);
    knob.textContent = theme === 'dark' ? 'Light' : 'Dark';
    try { localStorage.setItem('site-theme', theme); } catch (e) {}
  }

  let saved = null;
  try { saved = localStorage.getItem('site-theme'); } catch (e) {}
  const prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
  applyTheme(saved || (prefersLight ? 'light' : 'dark'));

  document.getElementById('themeToggle').addEventListener('click', () => {
    applyTheme(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });

  function tickClock() { clockEl.textContent = new Date().toLocaleTimeString('en-GB'); }
  tickClock();
  setInterval(tickClock, 1000);
</script>
</body>
</html>
